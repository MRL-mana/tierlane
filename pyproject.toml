[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tierlane"
version = "0.2.0"
description = "Route AI tasks to the cheapest CLI that can handle them, and keep your files off third-party clouds unless you say otherwise."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "cli", "router", "agent", "cost", "ollama", "claude", "codex", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MRL-mana/tierlane"
Issues = "https://github.com/MRL-mana/tierlane/issues"
Changelog = "https://github.com/MRL-mana/tierlane/releases"

[project.scripts]
tierlane = "tierlane.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["tierlane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
