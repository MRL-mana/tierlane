# tierlane configuration.
#
# Generated by `tierlane init`. Delete the tiers you do not have installed.
# Tiers are ordered by cost: level 0 should be the cheapest thing you own, and
# the numbers climb from there.

[defaults]
# --files may only read from these directories. Keep this narrow.
read_roots = ["."]
# Upper bound on how much file text is packed into one prompt.
max_context_chars = 12000
# Per-tier timeout, in seconds.
timeout = 300
# With --escalate, a result shorter than this counts as inadequate.
min_output_chars = 50

[[tier]]
level = 0
name = "ollama"
description = "Local model. Free, private, slower."
kind = "http"
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = "qwen2.5-coder:7b"
cloud = false

[[tier]]
level = 1
name = "gemini-flash"
description = "Fast and cheap. Good for summarising and lookup."
kind = "cli"
command = ["gemini", "-p", "{prompt}"]
cloud = true

[[tier]]
level = 2
name = "claude-haiku"
description = "Reviews and quality checks."
kind = "cli"
command = ["claude", "-p", "{prompt}", "--model", "haiku", "--output-format", "text"]
cloud = true

[[tier]]
level = 3
name = "codex"
description = "Bug hunting and dependency analysis, sandboxed read-only."
kind = "cli"
command = ["codex", "exec", "{prompt}", "-s", "read-only"]
cloud = true

[[rule]]
tier = 0
keywords = ["draft", "translate", "template", "format", "rename", "docstring"]

[[rule]]
tier = 1
keywords = ["summarize", "summarise", "research", "compare", "list", "explain"]

[[rule]]
tier = 2
keywords = ["review", "critique", "refactor", "test plan", "design"]

[[rule]]
tier = 3
keywords = ["bug", "debug", "dependency", "root cause", "regression"]

[hold]
keywords = [
  "deploy",
  "delete",
  "drop table",
  "force push",
  "rotate key",
  "credential",
  "production",
]
